site_name: FastAPI-Mergen
site_description: Principal-preserving transactional eventing for FastAPI and PostgreSQL
repo_url: https://github.com/mergen-institute/fastapi-mergen
strict: true
theme:
  name: material
nav:
  - Home: index.md
  - Concepts:
      - Boundary Contract: concepts/boundary-contract.md
      - Guarantees: concepts/guarantees.md
      - Authorization: concepts/authorization.md
      - Threat Model: concepts/threat-model.md
  - Operations:
      - Roles and RLS: operations/roles-and-rls.md
      - Relay: operations/relay.md
      - Retries and Replay: operations/retries-and-replay.md
  - Reference:
      - Glossary: reference/glossary.md
      - UoW Lifecycle: reference/uow-lifecycle.md
      - Data Model: reference/data-model.md
      - Route Snapshots: reference/route-snapshot-schema.md
      - Failure Taxonomy: reference/failure-taxonomy.md
      - Public API Spike: reference/public-api-spike.md
  - Decisions: adr/README.md
  - Milestone 1 Review: milestone-1-review.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
