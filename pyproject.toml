[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-effects"
dynamic = ["version"]
description = "Durable, tenant-aware side effects for FastAPI and PostgreSQL."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zsolt Döme" }]
keywords = [
  "fastapi",
  "multi-tenant",
  "outbox",
  "postgresql",
  "sqlalchemy",
  "webhooks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  # FastAPI 0.141 is the first certified line here with the security-fixed
  # Starlette 1.x transport required by the FastMCP 3.4 integration.
  "fastapi>=0.141,<0.142",
  "pydantic>=2.13,<3",
  "packaging>=25,<27",
  "SQLAlchemy[asyncio]>=2.0.50,<2.1",
  "starlette>=1.0.1,<2",
]

[project.optional-dependencies]
webhooks = [
  "cryptography>=46,<51",
  "httpx>=0.28.1,<1",
  "standardwebhooks>=1.1,<2",
]
otel = [
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
]
taskiq = [
  "taskiq>=0.12.5,<0.13",
  "taskiq-redis>=1.2,<2",
]
fastmcp = [
  "fastmcp>=3.4.7,<4",
]

[dependency-groups]
build = [
  # Keep the PEP 517 backend in uv.lock so release artifact builds can use an
  # exact build constraint instead of resolving an arbitrary newer backend.
  "setuptools>=82,<83",
]
test = [
  "asyncpg>=0.31,<1",
  "cryptography>=46,<51",
  "fastmcp>=3.4.7,<4",
  "httpx>=0.28.1,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "standardwebhooks>=1.1,<2",
  "taskiq>=0.12.5,<0.13",
  "taskiq-redis>=1.2,<2",
]
dev = [
  { include-group = "test" },
  "build>=1.5,<2",
  "mypy>=2.3,<3",
  "pre-commit>=4,<5",
  "ruff>=0.16.4,<1",
  "twine>=6.2,<7",
]
security = [
  { include-group = "dev" },
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
]

[project.urls]
Documentation = "https://github.com/zsoltdome/fastapi-effects#readme"
Issues = "https://github.com/zsoltdome/fastapi-effects/issues"
Repository = "https://github.com/zsoltdome/fastapi-effects"

[project.scripts]
fastapi-effects = "fastapi_effects.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fastapi_effects*"]
namespaces = false

[tool.setuptools.package-data]
fastapi_effects = ["py.typed", "conformance/spec/*.json", "postgres/migrations/alembic.ini"]

[tool.setuptools.dynamic]
version = { attr = "fastapi_effects._version.__version__" }

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
  "chaos: injects reviewed process, database, transport, broker, or key failures",
  "conformance: exercises the executable Boundary Contract assurance suite",
  "integration: requires a PostgreSQL integration service",
  "packaging: builds or inspects distribution artifacts",
  "security: validates a security invariant",
]
testpaths = ["tests", "examples"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["fastapi_effects"]

[tool.coverage.report]
fail_under = 63.5
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples", "scripts"]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "PIE", "PT", "RUF", "SIM", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["A002"]
"scripts/benchmark.py" = ["E402"]
"scripts/rehearse_postgres_restart.py" = ["E402"]
"scripts/generate_real_certification.py" = ["E402"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
pretty = true
mypy_path = ["src"]
files = ["src", "examples", "scripts"]
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
