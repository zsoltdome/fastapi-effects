name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pip-audit
      - run: uv run bandit -q -r src
