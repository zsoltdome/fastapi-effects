name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  checks: read

jobs:
  publish:
    if: github.repository == 'mergen-institute/fastapi-mergen'
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MERGEN_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      MERGEN_TEST_REDIS_URL: redis://127.0.0.1:56379/0
      MERGEN_IMPLEMENTATION_COMMIT: ${{ github.sha }}
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Install packaging environment
        run: uv sync --group security --all-extras
      - name: Verify release version
        run: |
          package_version="$(uv run python -c 'from fastapi_mergen import __version__; print(__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Verify hosted compatibility, security, and conformance checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/verify_hosted_release_checks.py
      - name: Build and test distributions
        run: uv run python scripts/build_and_test_artifacts.py
      - name: Run mandatory release gates
        run: |
          uv run python scripts/check.py
          uv run pytest -q -m integration
          uv run pip-audit
          uv run bandit -q -c bandit.yaml -r src
          uv run python scripts/security_scan.py
          uv run python scripts/audit_release_candidate.py --phase auto
      - name: Generate and verify real cumulative certification
        run: |
          uv run python scripts/generate_real_certification.py --manifest build/publish/certification-manifest.json --report build/publish/certification.json
          uv run fastapi-mergen conformance verify --manifest build/publish/certification-manifest.json --report build/publish/certification.json
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
