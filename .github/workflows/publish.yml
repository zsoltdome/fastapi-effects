name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  publish:
    if: github.repository == 'mergen-institute/fastapi-mergen'
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release version
        run: |
          package_version="$(python -c 'exec(open("src/fastapi_mergen/_version.py").read()); print(__version__)')"
          test "v${package_version}" = "${{ github.event.release.tag_name }}"
      - name: Resolve the successful evidence workflow for this exact tag and commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
            -f event=push -f status=success -f head_sha="${GITHUB_SHA}" -f per_page=100)"
          run_id="$(jq -r --arg sha "${GITHUB_SHA}" --arg tag "${RELEASE_TAG}" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .conclusion == "success")] | if length == 1 then .[0].id else empty end' \
            <<<"${runs}")"
          test -n "${run_id}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
      - name: Download the exact approved release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh run download "${{ steps.evidence.outputs.run_id }}"
          --repo "${GITHUB_REPOSITORY}"
          --name "release-evidence-${RELEASE_TAG}"
          --dir approved
      - name: Verify promoted artifact identity
        run: |
          package_version="$(python -c 'exec(open("src/fastapi_mergen/_version.py").read()); print(__version__)')"
          python scripts/release_artifacts.py verify \
            --root approved \
            --manifest approved/build/release/artifact-manifest.json \
            --source-commit "${GITHUB_SHA}" \
            --package-version "${package_version}" \
            --workflow-identity "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${{ github.event.release.tag_name }}#${{ steps.evidence.outputs.run_id }}" \
            --lock-file uv.lock
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: approved/dist/
