name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: compat-python-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
      - run: uv sync --locked --group dev --all-extras
      - run: uv run --no-sync pytest -q -m "not integration and not packaging" --durations=20
      - run: uv run --no-sync python scripts/build_and_test_artifacts.py --offline-system-packages
      - name: Bind compatibility evidence
        run: >-
          uv run --no-sync python scripts/write_compatibility_evidence.py
          --evidence-id compat-python-${{ matrix.python }}
          --selection "non-integration tests and package smoke"
          --output build/compatibility/compat-python-${{ matrix.python }}.json
      - name: Upload compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-python-${{ matrix.python }}-${{ github.sha }}
          path: build/compatibility
          if-no-files-found: error

  postgres:
    name: compat-pg${{ matrix.postgres }}-py${{ matrix.python_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "16"
            python: "3.11"
            python_id: "311"
          - postgres: "18"
            python: "3.14"
            python_id: "314"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FASTAPI_EFFECTS_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      FASTAPI_EFFECTS_TEST_REDIS_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
      - name: Select matching PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "postgresql-client-${{ matrix.postgres }}"
          client_dir="/usr/lib/postgresql/${{ matrix.postgres }}/bin"
          test -x "${client_dir}/pg_dump"
          test -x "${client_dir}/psql"
          echo "${client_dir}" >> "${GITHUB_PATH}"
      - run: uv sync --locked --group test --all-extras
      - run: uv run --no-sync pytest -q -m integration --durations=20
      - name: Bind compatibility evidence
        run: >-
          uv run --no-sync python scripts/write_compatibility_evidence.py
          --evidence-id compat-pg${{ matrix.postgres }}-py${{ matrix.python_id }}
          --selection "all PostgreSQL integration tests"
          --output build/compatibility/compat-pg${{ matrix.postgres }}-py${{ matrix.python_id }}.json
      - name: Upload compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat-pg${{ matrix.postgres }}-py${{ matrix.python_id }}-${{ github.sha }}
          path: build/compatibility
          if-no-files-found: error

  dependencies:
    name: ${{ matrix.evidence-id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - evidence-id: compat-min-base
            requirement: .
            resolution: lowest-direct
            imports: fastapi_effects
          - evidence-id: compat-min-webhooks
            requirement: .[webhooks]
            resolution: lowest-direct
            imports: fastapi_effects.webhooks.signing,cryptography,httpx,standardwebhooks
          - evidence-id: compat-min-otel
            requirement: .[otel]
            resolution: lowest-direct
            imports: fastapi_effects.observability.otel,opentelemetry
          - evidence-id: compat-min-taskiq
            requirement: .[taskiq]
            resolution: lowest-direct
            imports: fastapi_effects.executors.taskiq.adapter,taskiq,taskiq_redis
          - evidence-id: compat-min-fastmcp
            requirement: .[fastmcp]
            resolution: lowest-direct
            imports: fastapi_effects.integrations.fastmcp,fastmcp
          - evidence-id: compat-latest-all
            requirement: .[webhooks,otel,taskiq,fastmcp]
            resolution: highest
            imports: fastapi_effects,cryptography,httpx,opentelemetry,taskiq,fastmcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
      - name: Create isolated dependency environment
        run: uv venv --python 3.11 .compat-venv
      - name: Resolve exact dependency surface
        run: >-
          uv pip install --python .compat-venv/bin/python
          --resolution "${{ matrix.resolution }}"
          -e "${{ matrix.requirement }}"
      - name: Import exact dependency surface
        env:
          FASTAPI_EFFECTS_IMPORTS: ${{ matrix.imports }}
        run: .compat-venv/bin/python -c "import importlib, os; [importlib.import_module(name) for name in os.environ['FASTAPI_EFFECTS_IMPORTS'].split(',')]"
      - name: Bind compatibility evidence
        run: >-
          .compat-venv/bin/python scripts/write_compatibility_evidence.py
          --evidence-id ${{ matrix.evidence-id }}
          --selection "${{ matrix.resolution }} dependency import boundary"
          --output build/compatibility/${{ matrix.evidence-id }}.json
      - name: Upload compatibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.evidence-id }}-${{ github.sha }}
          path: build/compatibility
          if-no-files-found: error
