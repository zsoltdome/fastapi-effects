name: Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python scripts/build_and_test_artifacts.py
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
