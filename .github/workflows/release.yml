name: Release evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: read
  actions: read
  id-token: write
  attestations: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MERGEN_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      MERGEN_TEST_REDIS_URL: redis://127.0.0.1:56379/0
      MERGEN_IMPLEMENTATION_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true
      - run: uv sync --locked --group security --all-extras
      - name: Verify hosted compatibility, security, and conformance checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/verify_hosted_release_checks.py
      - name: Run mandatory quality and package gates
        run: uv run --no-sync python scripts/check.py --skip-artifact-build
      - name: Run mandatory integration gates
        run: uv run --no-sync pytest -q -m integration
      - name: Run security gates
        run: |
          uv run --no-sync pip-audit
          uv run --no-sync bandit -q -c bandit.yaml -r src
          uv run --no-sync python scripts/security_scan.py
      - name: Verify candidate gate
        run: uv run --no-sync python scripts/audit_release_candidate.py --phase auto
      - name: Build, smoke, and run database journeys from the exact wheel and sdist-derived wheel in isolated environments
        run: >-
          uv run --no-sync python scripts/build_and_test_artifacts.py
          --runtime-certification
          --runtime-test tests/integration/test_invoicing_postgres_boot.py
          --runtime-test tests/integration/test_webhook_receiver_inbox.py
          --runtime-test tests/integration/test_core_concurrency.py::test_fanout_failure_rolls_back_business_and_event_rows
          --runtime-test tests/integration/test_core_concurrency.py::test_finalization_refreshes_database_time_after_waiting_for_row_lock
      - name: Generate SBOM, checksums, schemas, and evidence manifest
        run: |
          mkdir -p build/release
          uv run --no-sync python scripts/generate_sbom.py --output build/release/sbom.cdx.json
          sha256sum dist/* > build/release/SHA256SUMS
          cp src/fastapi_mergen/conformance/spec/*.json build/release/
          package_version="$(uv run --no-sync python -c 'from fastapi_mergen import __version__; print(__version__)')"
          uv run --no-sync python scripts/release_artifacts.py create \
            --root . \
            --manifest build/release/artifact-manifest.json \
            --source-commit "${GITHUB_SHA}" \
            --package-version "${package_version}" \
            --workflow-identity "${GITHUB_WORKFLOW_REF}#${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --lock-file uv.lock \
            --evidence-file build/release/artifact-lock-constraints.txt \
            --evidence-file build/release/artifact-runtime-results.json \
            --evidence-file build/release/wheel-certification-manifest.json \
            --evidence-file build/release/wheel-certification.json \
            --evidence-file build/release/sdist-certification-manifest.json \
            --evidence-file build/release/sdist-certification.json \
            --evidence-file build/release/sbom.cdx.json \
            --evidence-file build/release/SHA256SUMS
      - name: Attest distributions and SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            dist/*
            build/release/sbom.cdx.json
            build/release/SHA256SUMS
            build/release/artifact-manifest.json
      - uses: actions/upload-artifact@043fb46c0a2a885bee3be2e27b237cefc35e90e8 # v7.0.1
        id: release-artifact
        with:
          name: release-evidence-${{ github.ref_name }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*
            build/release/*
          if-no-files-found: error
