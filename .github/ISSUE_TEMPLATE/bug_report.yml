name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: FastAPI-Mergen version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include expected and actual behavior without credentials or tenant data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PostgreSQL, FastAPI, SQLAlchemy, and operating-system versions.
    validations:
      required: true
