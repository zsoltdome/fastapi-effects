groups:
  - name: fastapi_effects
    rules:
      - alert: FastAPIEffectsBacklogOld
        expr: max(fastapi_effects_backlog_oldest_age_seconds) > 300
        for: 10m
        labels: {severity: page}
      - alert: FastAPIEffectsDeadRate
        expr: sum(rate(fastapi_effects_runtime_events_total{fastapi_effects_event_kind="dead"}[10m])) > 0.1
        for: 10m
        labels: {severity: page}
      - alert: FastAPIEffectsLeaseExpiry
        expr: sum(rate(fastapi_effects_runtime_events_total{fastapi_effects_event_kind="reconciled"}[10m])) > 0.1
        for: 10m
        labels: {severity: ticket}
      - alert: FastAPIEffectsWebhookPaused
        expr: increase(fastapi_effects_runtime_events_total{fastapi_effects_event_kind="webhook_paused"}[15m]) > 0
        labels: {severity: page}
      - alert: FastAPIEffectsCommandConflicts
        expr: sum(rate(fastapi_effects_runtime_events_total{fastapi_effects_event_kind="command_conflict"}[10m])) > 1
        for: 10m
        labels: {severity: ticket}
      - alert: FastAPIEffectsDelegationDenied
        expr: sum(rate(fastapi_effects_runtime_events_total{fastapi_effects_event_kind="delegation_denied"}[10m])) > 1
        for: 5m
        labels: {severity: page}
